# 编排端需要能建/删 Pod 和 PVC —— 座位的生命周期就是靠这个
apiVersion: v1
kind: Namespace
metadata:
  name: werewolf
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: werewolf-orchestrator
  namespace: werewolf
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: werewolf-orchestrator
  namespace: werewolf
rules:
  # 每个座位一个 Pod：开局创建，玩家离场立刻删除
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # 每个座位一个 PVC 存私有 memory。注意：**没有 delete** ——
  # Pod 被删掉之后笔记必须还在，所以编排端根本不该有删 PVC 的权限。
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: werewolf-orchestrator
  namespace: werewolf
subjects:
  - kind: ServiceAccount
    name: werewolf-orchestrator
    namespace: werewolf
roleRef:
  kind: Role
  name: werewolf-orchestrator
  apiGroup: rbac.authorization.k8s.io
---
# agent Pod 只跑自己那一个座位，不需要任何 k8s 权限
apiVersion: v1
kind: ServiceAccount
metadata:
  name: werewolf-agent
  namespace: werewolf
automountServiceAccountToken: false
