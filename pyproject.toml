[project]
name = "agent-werewolf"
version = "0.1.0"
description = "让 AI agent 坐在同一张牌桌上打一局标准 12 人狼人杀（屠边局）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# 核心运行时【零第三方依赖】：规则 bot、引擎、网页沙箱、SQLite 会话库
# 都只用标准库。要接真模型才需要装下面的可选依赖。
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
openai = ["openai>=1.0"]
k8s = ["kubernetes>=28.0"]
# 一次装齐所有模型后端
llm = ["anthropic>=1.0", "openai>=1.0"]
all = ["anthropic>=1.0", "openai>=1.0", "kubernetes>=28.0"]

[project.scripts]
werewolf = "werewolf.cli:main"
werewolf-server = "werewolf.server:main"
werewolf-agent = "werewolf.agent_server:serve"

[dependency-groups]
dev = ["playwright>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["werewolf"]

[tool.uv]
package = true
